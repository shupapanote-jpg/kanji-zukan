<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8e8"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
  <title>ぼくの漢字ずかん</title>
  <style>
    :root{--ink:#283349;--muted:#758096;--paper:#fffdf7;--blue:#547be7;--yellow:#ffd96a;--pink:#ffb7b0;--line:#e8e7e1}
    *{box-sizing:border-box}body{margin:0;background:#fff8e8;color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}
    .wrap{max-width:800px;margin:auto;padding:20px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:18px;background:var(--yellow);display:grid;place-items:center;font-size:29px;box-shadow:0 4px 0 #edbd42}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}.brand h1{font-size:22px;margin:2px 0}.count{background:white;border:2px solid #f0dfad;border-radius:99px;padding:8px 12px;font-weight:800;white-space:nowrap}
    .hero{background:#dff3e9;border-radius:24px;margin:23px 0;padding:18px 20px;display:flex;align-items:center;gap:14px}.hero .mascot{font-size:43px}.hero p{margin:0;line-height:1.65;font-weight:700}.hero small{color:#557267;font-weight:500}
    .panel{background:var(--paper);border:1px solid #f0eadb;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 4px 0 #eee6d5}.panel h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800;color:#58627a}input,textarea{font:inherit;border:2px solid var(--line);border-radius:13px;padding:11px 12px;background:white;color:var(--ink);outline:none;width:100%}input:focus,textarea:focus{border-color:#91a8f4}textarea{resize:vertical;min-height:68px}.kanji-input{font-size:30px;font-weight:800;text-align:center;max-width:115px}.actions{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap}button,.upload{border:0;border-radius:13px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white;box-shadow:0 3px 0 #3e5fb9}.secondary{background:#f1f3f8;color:#46516a}.danger{background:#fff0ee;color:#bf5149}.tools{display:flex;gap:8px}.tools button{font-size:13px;padding:9px 12px}.list-head{display:flex;align-items:center;gap:10px;margin:21px 0 12px}.list-head h2{margin:0;font-size:20px}.search{flex:1}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #eee8da;border-radius:20px;padding:15px;box-shadow:0 3px 0 #eee6d5;position:relative}.card-top{display:flex;align-items:center;gap:12px}.big-kanji{width:66px;height:66px;border-radius:19px;background:#fff1c6;display:grid;place-items:center;font-size:39px;font-weight:900;color:#55492f;object-fit:contain}.readings{font-weight:800}.readings small{display:block;color:var(--muted);font-weight:600;margin-top:4px}.meaning{margin:13px 0 5px;font-weight:700;line-height:1.55}.example{border-top:1px dashed var(--line);padding-top:9px;color:#68748b;font-size:13px;line-height:1.55}.card-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}.card-actions button{font-size:12px;padding:7px 10px}.empty{text-align:center;background:#fff;border:2px dashed #eadfbd;border-radius:20px;padding:30px 15px;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-size:17px;margin:8px}.foot{text-align:center;color:#8a8f9b;font-size:12px;margin:22px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#283349;color:white;padding:11px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.file{display:none}.draw-wrap{width:min(100%,330px)}#drawCanvas{display:block;width:100%;height:185px;border:2px dashed #cbd3e2;border-radius:16px;background:white;touch-action:none;cursor:crosshair}.hint{margin:0;font-size:12px;color:var(--muted)}
    @media(max-width:520px){.wrap{padding:14px 14px 38px}.brand h1{font-size:19px}.logo{width:46px;height:46px}.hero{padding:15px}.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.count{font-size:13px;padding:7px 10px}.panel{padding:15px}.tools button{padding:8px 9px}.list-head{flex-wrap:wrap}.search{flex-basis:100%;order:2}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand"><div class="logo">📚</div><div><div class="eyebrow">じぶんだけの</div><h1>ぼくの漢字ずかん</h1></div></div><div class="count" id="count">0 文字</div></header>
  <section class="hero"><div class="mascot">🦉</div><p>見つけた漢字を、どんどん集めよう！<br><small>読み方や意味も書いて、自分だけのずかんにしよう。</small></p></section>
  <section class="panel"><h2 id="formTitle">✏️ 漢字をとうろく</h2><form id="entryForm"><input type="hidden" id="editId"><div class="grid">
    <div class="field"><label for="kanji">漢字（読めたら入力）</label><input class="kanji-input" id="kanji" maxlength="2" placeholder="森"></div>
    <div class="field full"><label for="drawCanvas">✍️ Apple Pencilで漢字を書く</label><div class="draw-wrap"><canvas id="drawCanvas" aria-label="漢字を書く場所"></canvas><p class="hint">指でも書けます。変換できない漢字は、ここに形を残そう。</p></div><button class="secondary" type="button" id="clearDraw">書きなおす</button></div>
    <div class="field"><label for="reading">読み方</label><input id="reading" placeholder="もり・シン"></div>
    <div class="field full"><label for="meaning">意味・気づいたこと</label><input id="meaning" placeholder="木がたくさんあるところ"></div>
    <div class="field full"><label for="example">この漢字をつかった文</label><textarea id="example" placeholder="森の中で、鳥の声がした。"></textarea></div>
  </div><div class="actions"><button class="primary" type="submit" id="saveBtn">ずかんに入れる</button><button class="secondary" type="button" id="cancelBtn" hidden>やめる</button></div></form></section>
  <div class="list-head"><h2>🌟 あつめた漢字</h2><input class="search" id="search" placeholder="漢字や読み方でさがす"></div>
  <div class="tools"><button class="secondary" id="exportBtn">📤 べつのiPadへうつす</button><button class="secondary" id="importBtn">📥 ずかんを読みこむ</button><input class="file" type="file" id="fileInput" accept="application/json,.json"></div>
  <section class="cards" id="cards"></section><div class="foot">このiPadに自動で保存されるよ<br>別のiPadへは「べつのiPadへうつす」でファイルを渡せます。</div>
</main><div class="toast" id="toast"></div>
<script>
const KEY='my-kanji-zukan-v1';let entries=load();const $=id=>document.getElementById(id);const canvas=$('drawCanvas'),ctx=canvas.getContext('2d');let drawing=false,hasDrawing=false;
function sizeCanvas(){const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#283349'}
function point(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
canvas.addEventListener('pointerdown',ev=>{drawing=true;canvas.setPointerCapture(ev.pointerId);const p=point(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);hasDrawing=true});canvas.addEventListener('pointermove',ev=>{if(!drawing)return;const p=point(ev);ctx.lineTo(p.x,p.y);ctx.stroke()});['pointerup','pointercancel'].forEach(type=>canvas.addEventListener(type,()=>drawing=false));
function clearDrawing(){ctx.clearRect(0,0,canvas.width,canvas.height);hasDrawing=false}
function setDrawing(data){clearDrawing();if(!data)return;const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight);hasDrawing=true};img.src=data}
sizeCanvas();window.addEventListener('resize',()=>sizeCanvas());$('clearDraw').onclick=clearDrawing;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function persist(){localStorage.setItem(KEY,JSON.stringify(entries));render()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLowerCase();const shown=entries.filter(e=>[e.kanji,e.reading,e.meaning,e.example].join(' ').toLowerCase().includes(q));$('count').textContent=entries.length+' 文字';$('cards').innerHTML=shown.length?shown.map(e=>`<article class="card"><div class="card-top">${e.drawing?`<img class="big-kanji" src="${e.drawing}" alt="手書きの漢字">`:`<div class="big-kanji">${esc(e.kanji||'？')}</div>`}<div class="readings">${esc(e.reading||'読み方はこれから')}<small>${esc(e.kanji||'手書きで登録')} · ${new Date(e.updated||e.created).toLocaleDateString('ja-JP')}</small></div></div>${e.meaning?`<div class="meaning">${esc(e.meaning)}</div>`:''}${e.example?`<div class="example">「${esc(e.example)}」</div>`:''}<div class="card-actions"><button class="secondary" data-edit="${e.id}">なおす</button><button class="danger" data-del="${e.id}">けす</button></div></article>`).join(''):`<div class="empty">🪄<strong>${q?'見つからなかったよ':'まだ漢字がないよ'}</strong>${q?'ちがう言葉でもさがしてみてね':'上のフォームから、さいしょの漢字を入れてみよう！'}</div>`}
function reset(){ $('entryForm').reset();$('editId').value='';clearDrawing();$('formTitle').textContent='✏️ 漢字をとうろく';$('saveBtn').textContent='ずかんに入れる';$('cancelBtn').hidden=true }
$('entryForm').addEventListener('submit',ev=>{ev.preventDefault();const id=$('editId').value;const old=entries.find(e=>e.id===id);if(!$('kanji').value.trim()&&!hasDrawing){toast('漢字を入力するか、手書きしてね');return}const item={id:id||crypto.randomUUID(),kanji:$('kanji').value.trim(),drawing:hasDrawing?canvas.toDataURL('image/png'):(old?.drawing||''),reading:$('reading').value.trim(),meaning:$('meaning').value.trim(),example:$('example').value.trim(),created:old?.created||Date.now(),updated:Date.now()};if(old)entries=entries.map(e=>e.id===id?item:e);else entries.unshift(item);persist();reset();toast(old?'なおしたよ！':'ずかんに入ったよ！')});
$('cancelBtn').onclick=reset;$('search').oninput=render;
$('cards').addEventListener('click',ev=>{const id=ev.target.dataset.edit||ev.target.dataset.del;if(!id)return;const e=entries.find(x=>x.id===id);if(ev.target.dataset.edit){$('editId').value=id;$('kanji').value=e.kanji;$('reading').value=e.reading;$('meaning').value=e.meaning;$('example').value=e.example;setDrawing(e.drawing);$('formTitle').textContent='🖍️ 漢字をなおす';$('saveBtn').textContent='へんこうを保存';$('cancelBtn').hidden=false;scrollTo({top:0,behavior:'smooth'})}else if(confirm(`「${e.kanji||'手書きの漢字'}」をずかんからけす？`)){entries=entries.filter(x=>x.id!==id);persist();toast('けしたよ')}});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'my-kanji-zukan',version:1,entries},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ぼくの漢字ずかん.json';a.click();URL.revokeObjectURL(a.href);toast('ファイルを保存したよ！')};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.entries;if(!Array.isArray(incoming))throw Error();const map=new Map(entries.map(e=>[e.id,e]));for(const e of incoming)if(e.kanji||e.drawing){const id=e.id||crypto.randomUUID();map.set(id,{id,kanji:String(e.kanji||'').slice(0,2),drawing:e.drawing||'',reading:e.reading||'',meaning:e.meaning||'',example:e.example||'',created:e.created||Date.now(),updated:e.updated||Date.now()})}entries=[...map.values()];persist();toast('ずかんを読みこんだよ！')}catch{alert('このファイルは読みこめなかったよ。ずかんのファイルを選んでね。')}ev.target.value=''};
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}render();
</script><script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
